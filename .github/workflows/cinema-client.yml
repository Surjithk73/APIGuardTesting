name: CinemaFlow client validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cinema-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cinema.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test movie_booking/tests/cinema-http.test.mjs
      - run: python -m pytest movie_booking/tests -q
